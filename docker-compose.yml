services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    working_dir: /app/cv_filter
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      MAKE_NLQ_WEBHOOK_URL: "https://hook.eu2.make.com/ici0w3yicefmfxj7qyfc0rlg7lxittav"
      MAKE_SUMMARY_WEBHOOK_URL: "https://hook.eu2.make.com/q9ajt9ig532lhx083cv5wqr6zo324dd0"
      MAKE_WEBHOOK_SECRET: "${MAKE_WEBHOOK_SECRET:-}"
      MAKE_TIMEOUT_SECONDS: "15"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - uploads_data:/app/uploads

  frontend:
    image: node:20-alpine
    working_dir: /app/frontend/cv-filter-fe
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    volumes:
      - .:/app
    depends_on:
      - web

volumes:
  postgres_data:
  uploads_data:
